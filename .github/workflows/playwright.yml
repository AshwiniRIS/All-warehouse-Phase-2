name: Playwright CI

on:
  push:
    branches:
      - DEV   

jobs:
  test:
    runs-on: windows-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r playwright_AWH_py/requirement.txt
        pip install behave
        python -m playwright install chromium

    - name: Create server.key
      shell: powershell
      run: |
        @"
        ${{ secrets.SF_PRIVATE_KEY }}
        "@ | Out-File -FilePath playwright_AWH_py/server.key -Encoding utf8

    - name: Run Tests
      shell: powershell
      env:
        SF_Login_url: ${{ secrets.SF_Login_url }}
        SF_client_id: ${{ secrets.SF_client_id }}
        SF_Username: ${{ secrets.SF_Username }}
      run: |
        $env:PYTHONPATH = "$PWD/playwright_AWH_py"
        $env:PYTHONIOENCODING = "utf-8"
        python -X utf8 -m behave playwright_AWH_py/features --tags=@API

    - name: Upload Screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: failure-screenshots
        path: screenshots/
        if-no-files-found: ignore

    - name: Send Email Notification
      if: always()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        secure: true
        username: ${{ secrets.Email_Username }}
        password: ${{ secrets.Email_Password }}

        subject: "[${{ job.status }}] Playwright Automation Execution Report"

        body: |
          Hi Team,

          The GitHub Action workflow has completed.

          Repository: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Status: ${{ job.status }}
          Triggered By: ${{ github.actor }}
          Commit Message: ${{ github.event.head_commit.message }}

          View Logs:
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

        to: ashwinimca96@gmail.com,aswini.p@rudhrainfosolutions.com
        from: GitHub Actions

      